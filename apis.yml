apis:
- name: Mobia Medical Site REST API (WordPress)
  description: >-
    The WordPress REST API served by the Mobia Medical corporate site at
    https://www.mobia.com/wp-json/. It is the content-management API behind the marketing
    site — 320 routes across 22 namespaces including wp/v2 (posts, pages, media, news,
    team), wp-abilities/v1 and an mcp namespace — not a Vivistim product or device API.
    Anonymous reads are open; writes and the MCP endpoints require authentication.
