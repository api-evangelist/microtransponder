aid: microtransponder
name: MicroTransponder
description: >-
  MicroTransponder, Inc. — renamed Mobia Medical, Inc. on 2026-02-24 — is a privately
  founded, Austin/Dallas Texas medical device company that develops the FDA-approved
  Vivistim Paired VNS System, an implantable vagus nerve stimulation device paired with
  rehabilitation therapy to reduce upper-extremity motor deficits in chronic ischemic
  stroke survivors. The company is a medical device manufacturer, not a software vendor:
  it publishes no developer portal, no product API, no SDKs and no public source
  repositories. The only machine-readable surface API Evangelist could reach on hosts the
  company controls is the WordPress REST API behind its corporate site (www.mobia.com) and
  its product site (www.vivistim.com), plus an OAuth-protected Model Context Protocol
  endpoint the corporate site serves via the WordPress MCP Adapter, with RFC 8414 and
  RFC 9728 discovery documents. This profile records that surface and nothing more.
