reversibility:
  grade: documented
  applies: true
  note: >-
    The write surface is the WordPress content API. Its one reversal path is the Trash:
    DELETE without `force` soft-deletes, and the item can be restored by setting `status`
    back. This is read from the route descriptor the host itself serves, NOT from a
    provider policy page — the provider publishes none. No retention window is stated
    anywhere by the provider, so this grades `documented`, not `verified`.
  surfaces:
  - write_operation: DELETE /wp/v2/{post,pages,media,news,team,blocks}/{id}
    reversal: >-
      Omit `force` (default false) — the item goes to Trash instead of being deleted.
      Restore with POST/PUT/PATCH on the same id setting `status` to `publish` or `draft`.
    window: null
    window_source: null
    window_note: >-
      NOT STATED by the provider. WordPress' default trash-emptying interval is a
      site-configuration value (EMPTY_TRASH_DAYS) that this host does not publish, so no
      window is asserted here.
    evidence: >-
      discovery/microtransponder-wp-rest-routes.json — DELETE arg `force`
      {"type":"boolean","default":false,"description":"Whether to bypass Trash and force
      deletion."}; PUT arg `status` enum [publish, future, draft, pending, private]
  - write_operation: DELETE /wp/v2/{...}/{id}?force=true
    reversal: none
    window: null
    window_note: Permanent — `force=true` bypasses Trash. There is no undo.
  - write_operation: POST /wp-abilities/v1/abilities/{name}/run
    reversal: unknown
    window: null
    window_note: >-
      The ability set is not readable anonymously, so the consequence and reversibility of
      each ability cannot be established. Nothing is asserted.
